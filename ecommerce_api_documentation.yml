openapi: 3.0.3

info:
  title: E-Commerce Nerdery REST API
  version: 1.0.0
  description: |
    REST API for an e-commerce platform following DDD and best practices.

servers:
  - url: https://api.example.com/api/v1
    description: Production server

tags:
  - name: Auth
  - name: Users
  - name: Categories
  - name: Products
  - name: Cart
  - name: Orders
  - name: Payments

security:
  - bearerAuth: []

paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Register a new client user
      operationId: createRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: User created successfully
        "400":
          description: Invalid input

  /auth/signin:
    post:
      tags: [Auth]
      summary: Authenticate user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Invalid credentials

  /auth/signout:
    post:
      tags: [Auth]
      summary: Sign out user
      operationId: signOutUser
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Successfully signed out
        "401":
          description: Unauthorized

  /auth/password-reset-requests:
    post:
      tags: [Auth]
      summary: Request password reset
      operationId: createPasswordResetRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset email sent

  /auth/password-resets:
    post:
      tags: [Auth]
      summary: Reset password
      operationId: createPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successful

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      operationId: getMyProfile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/{userId}/activation:
    patch:
      tags: [Users]
      summary: Activate or deactivate a user (Manager)
      security:
        - bearerAuth: []
      requestBody:
       required: true
       content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserActivationRequest"
      responses:
       "204":
        description: User activation status updated
       "404":
        description: User not found
    parameters:
      - $ref: "#/components/parameters/userId"

  /categories:
    get:
      tags: [Categories]
      summary: List categories
      operationId: listCategories
      responses:
        "200":
          description: Categories list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

    post:
      tags: [Categories]
      summary: Create category (Manager)
      security:
        - bearerAuth: []
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created

  /products:
    get:
      tags: [Products]
      summary: List products (public)
      operationId: listProducts
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - name: categoryId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedProductResponse"

    post:
      tags: [Products]
      summary: Create product (Manager)
      security:
        - bearerAuth: []
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created

  /products/{productId}:
    get:
      tags: [Products]
      summary: Get product details
      operationId: getProduct
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

    put:
      tags: [Products]
      summary: Update product (Manager)
      security:
        - bearerAuth: []
      operationId: updateProduct
      parameters:
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated
    patch:
      tags: [Products]
      summary: Activate/Deactivate Product (Manager)
      security:
        - bearerAuth: []
      operationId: patchProduct
      parameters:
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProductRequest"
      responses:
        "200":
          description: Product Activated/Deactivated

    delete:
      tags: [Products]
      summary: Delete product (Manager)
      security:
        - bearerAuth: []
      operationId: deleteProduct
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "204":
          description: Product deleted

  /products/{productId}/images:
    post:
      tags: [Products]
      summary: Upload product images (Manager)
      security:
        - bearerAuth: []
      operationId: uploadProductImages
      parameters:
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                isPrimary:
                  type: boolean
                  description: Set the first uploaded image as primary
      responses:
        "200":
          description: Images uploaded successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductImage"
        "400":
          description: Invalid file format
        "404":
          description: Product not found

  /products/{productId}/images/{imageId}:
    delete:
      tags: [Products]
      summary: Delete product image (Manager)
      security:
        - bearerAuth: []
      operationId: deleteProductImage
      parameters:
        - $ref: "#/components/parameters/productId"
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Image deleted
        "404":
          description: Product or image not found

  /products/{productId}/images/{imageId}/primary:
    patch:
      tags: [Products]
      summary: Set image as primary (Manager)
      security:
        - bearerAuth: []
      operationId: setPrimaryProductImage
      parameters:
        - $ref: "#/components/parameters/productId"
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Primary image updated
        "404":
          description: Product or image not found

  /products/{productId}/likes:
    post:
      tags: [Products]
      summary: Like a product (Client)
      security:
        - bearerAuth: []
      operationId: likeProduct
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "201":
          description: Product liked
        "404":
          description: Product not found
        "409":
          description: Product already liked
    delete:
      tags: [Products]
      summary: Unlike a product (Client)
      security:
        - bearerAuth: []
      operationId: unlikeProduct
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "204":
          description: Product unliked
        "404":
          description: Product or like not found

  /products/{productId}/likes/status:
    get:
      tags: [Products]
      summary: Check if current user liked a product
      security:
        - bearerAuth: []
      operationId: getProductLikeStatus
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Like status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isLiked:
                    type: boolean

  /cart:
    get:
      tags: [Cart]
      summary: Get current user's cart
      operationId: getMyCart
      responses:
        "200":
          description: Cart details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
      responses:
        "201":
          description: Item added
        "404":
          description: Product not found
        "409":
          description: Insufficient stock

  /cart/items/{cartItemId}:
    put:
      tags: [Cart]
      summary: Update cart item quantity
      operationId: updateCartItem
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Cart item updated
        "404":
          description: Cart item not found
        "409":
          description: Insufficient stock
    delete:
      tags: [Cart]
      summary: Remove item from cart
      operationId: removeCartItem
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Item removed
        "404":
          description: Cart item not found

  /orders:
    post:
      tags: [Orders]
      summary: Create order (checkout)
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "409":
          description: Insufficient stock or invalid cart

    get:
      tags: [Orders]
      summary: List all orders (Manager)
      security:
        - bearerAuth: []
      operationId: listOrders
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderGetManager"

  /orders/me:
    get:
      tags: [Orders]
      summary: Get current user's orders
      operationId: getMyOrders
      responses:
        "200":
          description: User orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /addresses:
    get:
      tags: [Users]
      summary: Get current user's addresses
      operationId: getMyAddresses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
    post:
      tags: [Users]
      summary: Create a new address
      operationId: createAddress
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddressRequest"
      responses:
        "201":
          description: Address created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"

  /addresses/{addressId}:
    delete:
      tags: [Users]
      summary: Delete an address
      operationId: deleteAddress
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Address deleted
        "404":
          description: Address not found

  /payment-intents/{orderId}:
    post:
      tags: [Payments]
      summary: Create Stripe payment intent for an order
      operationId: createPaymentIntentForOrder
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentResponse"
        "404":
          description: Order not found
        "409":
          description: Order already paid or invalid state

  /webhooks/stripe:
    post:
      tags: [Payments]
      summary: Stripe webhook endpoint
      operationId: handleStripeWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processed
        "400":
          description: Invalid webhook signature


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    productId:
      name: productId
      in: path
      required: true
      schema:
        type: integer

    userId:
      name: userId
      in: path
      required: true
      schema:
        type: integer

    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    page:
      name: page
      in: query
      schema:
        type: integer
        default: 0

    size:
      name: size
      in: query
      schema:
        type: integer
        default: 10

  schemas:
    SignUpRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPasswordRequest:
      type: object
      required: [token, newPassword, confirmPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
        confirmPassword:
          type: string

    AuthToken:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer

    UserActivationRequest:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
          enum: [MANAGER, CLIENT]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Address:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        street:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateAddressRequest:
      type: object
      required: [street, city, country, postalCode]
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string
        isDefault:
          type: boolean

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: integer
        isActive:
          type: boolean
        categoryIds:
          type: array
          items:
            type: integer
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        likesCount:
          type: integer
        createdByUserId:
          type: integer
          format: int64

    ProductImage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        imageUrl:
          type: string
        isPrimary:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      required: [name, price, stock, categoryId]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: integer
        categoryId:
          type: integer

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: integer
        categoryId:
          type: integer

    PatchProductRequest:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean

    PagedProductResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        totalElements:
          type: integer
        totalPages:
          type: integer

    Cart:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        status:
          type: string
          enum: [ACTIVE, CHECKED_OUT, ABANDONED]
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        totalAmount:
          type: number
        createdAt:
          type: string
          format: date-time
        checkedOutAt:
          type: string
          format: date-time
          nullable: true

    CartItem:
      type: object
      properties:
        id:
          type: integer
        cartId:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
        subtotal:
          type: number
    AddCartItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          minimum: 1

    CreateOrderRequest:
      type: object
      required: [addressId]
      properties:
        addressId:
          type: integer
        discountCode:
          type: string
          nullable: true

    CreateOrderResponse:
      type: object
      properties:
        orderId:
          type: integer

    OrderGetManager:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [PENDING, PAID, CANCELLED]
        totalAmount:
          type: number
        discountAmount:
          type: number
        finalAmount:
          type: number
        createdAt:
          type: string
          format: date-time
        cartId:
          type: integer
        userId:
          type: integer
        addressId:
          type: integer
        discountId:
          type: integer
          nullable: true

    Order:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [PENDING, PAID, CANCELLED]
        totalAmount:
          type: number
        discountAmount:
          type: number
        finalAmount:
          type: number
        createdAt:
          type: string
          format: date-time
        cartId:
          type: integer
        addressId:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        priceAtPurchase:
          type: number
        quantity:
          type: integer
        subtotal:
          type: number

    PaymentIntentResponse:
      type: object
      properties:
        paymentIntentId:
          type: string
        clientSecret:
          type: string

    Payment:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        stripePaymentIntentId:
          type: string
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED]
        amount:
          type: number
        createdAt:
          type: string
          format: date-time
