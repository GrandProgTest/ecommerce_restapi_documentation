openapi: 3.0.3

info:
  title: E-Commerce Nerdery REST API
  version: 1.0.0
  description: |
    REST API for an e-commerce platform following DDD and best practices.

servers:
  - url: https://api.example.com/api/v1
    description: Production server

tags:
  - name: Auth
  - name: Users
  - name: Categories
  - name: Products
  - name: Cart
  - name: Orders
  - name: Payments

security:
  - bearerAuth: []

paths:
  /auth/sign-up:
    post:
      tags: [Auth]
      summary: Sign up a new user
      description: Create a new user account
      operationId: signUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Invalid input
        "404":
          description: User not found

  /auth/sign-in:
    post:
      tags: [Auth]
      summary: Sign in a user
      description: Authenticate a user and get a token
      operationId: signIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: User authenticated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "400":
          description: Invalid credentials

  /auth/sign-out:
    post:
      tags: [Auth]
      summary: Sign out user session
      description: Sign out the current user
      operationId: signOut
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Successfully signed out
        "401":
          description: Unauthorized

  /auth/password-reset-requests:
    post:
      tags: [Auth]
      summary: Request password reset
      operationId: createPasswordResetRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset email sent

  /auth/password-resets:
    post:
      tags: [Auth]
      summary: Reset password
      description: Reset user password using a valid token. An email notification will be sent to the user upon successful password change.
      operationId: createPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successful, confirmation email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password has been reset successfully. A confirmation email has been sent."

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      operationId: getMyProfile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/{userId}/activation:
    patch:
      tags: [Users]
      summary: Activate or deactivate a user (Manager)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserActivationRequest"
      responses:
        "204":
          description: User activation status updated
        "404":
          description: User not found
    parameters:
      - $ref: "#/components/parameters/userId"

  /categories:
    get:
      tags: [Categories]
      summary: Get all categories
      description: Get all categories. Public endpoint - No authentication required.
      operationId: getAllCategories
      security: []
      responses:
        "200":
          description: Categories retrieved successfully (may be empty list)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

    post:
      tags: [Categories]
      summary: Create a new category
      description: Create a new category. Only ROLE_MANAGER can create categories.
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Invalid input
        "403":
          description: Forbidden - Requires ROLE_MANAGER
        "404":
          description: Category not found

  /categories/{categoryId}:
    get:
      tags: [Categories]
      summary: Get category by id
      description: Get category by id. Public endpoint - No authentication required.
      operationId: getCategoryById
      security: []
      parameters:
        - $ref: "#/components/parameters/categoryId"
      responses:
        "200":
          description: Category found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Category not found

    put:
      tags: [Categories]
      summary: Update category
      description: Update category. Only ROLE_MANAGER can update categories.
      operationId: updateCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/categoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
        "404":
          description: Category not found

    delete:
      tags: [Categories]
      summary: Delete category
      description: Delete category. Only ROLE_MANAGER can delete categories.
      operationId: deleteCategory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/categoryId"
      responses:
        "204":
          description: Category deleted successfully
        "403":
          description: Forbidden - Requires ROLE_MANAGER
        "404":
          description: Category not found
        "409":
          description: Conflict - Category has associated products

  /products:
    get:
      tags: [Products]
      summary: Get all products
      description: Get all products with pagination support. Public endpoint - No authentication required.
      operationId: getAllProducts
      security: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
      responses:
        "200":
          description: Products retrieved successfully (may be empty list)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedProductResponse"

    post:
      tags: [Products]
      summary: Create a new product
      description: Create a new product. Only users with ROLE_MANAGER can create products.
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid input
        "403":
          description: Forbidden - Requires ROLE_MANAGER
        "404":
          description: Product not found

  /categories/{categoryId}/products:
    get:
      tags: [Products]
      summary: Get products by category
      description: Get all products filtered by category with pagination support. Public endpoint - No authentication required.
      operationId: getProductsByCategory
      security: []
      parameters:
        - $ref: "#/components/parameters/categoryId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
      responses:
        "200":
          description: Products filtered by category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedProductResponse"
        "404":
          description: Category not found

  /products/{productId}/activation:
    patch:
      tags: [Products]
      summary: Activate or deactivate a product (Manager)
      description: Enable or disable a product visibility and availability. Only ROLE_MANAGER can perform this action.
      operationId: updateProductActivation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProductRequest"
      responses:
        "204":
          description: Product activation status updated
        "403":
          description: Forbidden - Requires ROLE_MANAGER
        "404":
          description: Product not found

  /products/{productId}:
    get:
      tags: [Products]
      summary: Get product by id
      description: Get product details by id. Public endpoint - No authentication required.
      operationId: getProductById
      security: []
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found

    put:
      tags: [Products]
      summary: Update product
      description: Update product. Only ROLE_MANAGER can update products.
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
        "404":
          description: Product not found

    delete:
      tags: [Products]
      summary: Delete product
      description: Delete product. Only ROLE_MANAGER can delete products.
      operationId: deleteProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Product deleted successfully
        "403":
          description: Forbidden - Requires ROLE_MANAGER
        "404":
          description: Product not found

  /products/{productId}/category:
    post:
      tags: [Products]
      summary: Assign category to product
      description: Assign an existing category to a product. Only ROLE_MANAGER can assign categories.
      operationId: assignCategoryToProduct
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/productId"
        - name: categoryId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Category assigned to product successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
        "404":
          description: Product or category not found
        "400":
          description: Category already assigned to product

  /products/{productId}/images:
    post:
      tags: [Products]
      summary: Upload product images (Manager)
      security:
        - bearerAuth: []
      operationId: uploadProductImages
      parameters:
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                isPrimary:
                  type: boolean
                  description: Set the first uploaded image as primary
      responses:
        "200":
          description: Images uploaded successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductImage"
        "400":
          description: Invalid file format
        "404":
          description: Product not found

  /products/{productId}/images/{imageId}:
    delete:
      tags: [Products]
      summary: Delete product image (Manager)
      security:
        - bearerAuth: []
      operationId: deleteProductImage
      parameters:
        - $ref: "#/components/parameters/productId"
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Image deleted
        "404":
          description: Product or image not found

  /products/{productId}/images/{imageId}/primary:
    patch:
      tags: [Products]
      summary: Set image as primary (Manager)
      security:
        - bearerAuth: []
      operationId: setPrimaryProductImage
      parameters:
        - $ref: "#/components/parameters/productId"
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Primary image updated
        "404":
          description: Product or image not found

  /products/{productId}/likes:
    post:
      tags: [Products]
      summary: Like a product (Client)
      security:
        - bearerAuth: []
      operationId: likeProduct
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "201":
          description: Product liked
        "404":
          description: Product not found
        "409":
          description: Product already liked
    delete:
      tags: [Products]
      summary: Unlike a product (Client)
      security:
        - bearerAuth: []
      operationId: unlikeProduct
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "204":
          description: Product unliked
        "404":
          description: Product or like not found

  /products/{productId}/likes/status:
    get:
      tags: [Products]
      summary: Check if current user liked a product
      security:
        - bearerAuth: []
      operationId: getProductLikeStatus
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Like status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isLiked:
                    type: boolean

  /cart:
    get:
      tags: [Cart]
      summary: Get current user's cart
      operationId: getMyCart
      responses:
        "200":
          description: Cart details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
      responses:
        "201":
          description: Item added
        "404":
          description: Product not found
        "409":
          description: Insufficient stock

  /cart/items/{cartItemId}:
    put:
      tags: [Cart]
      summary: Update cart item quantity
      operationId: updateCartItem
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Cart item updated
        "404":
          description: Cart item not found
        "409":
          description: Insufficient stock
    delete:
      tags: [Cart]
      summary: Remove item from cart
      operationId: removeCartItem
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Item removed
        "404":
          description: Cart item not found

  /orders:
    post:
      tags: [Orders]
      summary: Create order (checkout)
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "409":
          description: Insufficient stock or invalid cart

    get:
      tags: [Orders]
      summary: List all orders (Manager)
      security:
        - bearerAuth: []
      operationId: listOrders
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderGetManager"

  /orders/me:
    get:
      tags: [Orders]
      summary: Get current user's orders
      operationId: getMyOrders
      responses:
        "200":
          description: User orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /orders/{orderId}/cancellation:
    post:
      tags: [Orders]
      summary: Create order cancellation
      description: Cancel a pending order. Clients can cancel their own orders, managers can cancel any order.
      operationId: createOrderCancellation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "403":
          description: Forbidden - Cannot cancel orders for other users
        "404":
          description: Order not found
        "409":
          description: Conflict - Order cannot be cancelled (already paid or cancelled)

  /addresses:
    get:
      tags: [Users]
      summary: Get current user's addresses
      operationId: getMyAddresses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
    post:
      tags: [Users]
      summary: Create a new address
      operationId: createAddress
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddressRequest"
      responses:
        "201":
          description: Address created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"

  /addresses/{addressId}:
    delete:
      tags: [Users]
      summary: Delete an address
      operationId: deleteAddress
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Address deleted
        "404":
          description: Address not found

  /payment-intents/{orderId}:
    post:
      tags: [Payments]
      summary: Create Stripe payment intent for an order
      operationId: createPaymentIntentForOrder
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentResponse"
        "404":
          description: Order not found
        "409":
          description: Order already paid or invalid state

  /webhooks/stripe:
    post:
      tags: [Payments]
      summary: Stripe webhook endpoint
      operationId: handleStripeWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processed
        "400":
          description: Invalid webhook signature

  /notifications/low-stock:
    post:
      tags: [Products]
      summary: Trigger low stock notifications
      description: Internal endpoint to send email notifications to users who liked a product when stock reaches 3 or below. This is typically triggered by background jobs monitoring stock levels.
      operationId: sendLowStockNotifications
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LowStockNotificationRequest"
      responses:
        "200":
          description: Notifications sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  notificationsSent:
                    type: integer
                    description: Number of notifications sent
                  productId:
                    type: integer
                    format: int64
        "403":
          description: Forbidden - Requires ROLE_MANAGER
        "404":
          description: Product not found


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    productId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    categoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    userId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    page:
      name: page
      in: query
      schema:
        type: integer
        default: 0

    size:
      name: size
      in: query
      schema:
        type: integer
        default: 10

  schemas:
    SignUpRequest:
      type: object
      required: [username, email, password, role]
      properties:
        username:
          type: string
          description: Username for the new user
          example: "john_doe"
        email:
          type: string
          format: email
          description: Email address for the new user
          example: "john@example.com"
        password:
          type: string
          description: Password for the new user
          example: "SecurePass123!"
        role:
          type: string
          description: Role name (ROLE_MANAGER or ROLE_CLIENT)
          enum: [ROLE_MANAGER, ROLE_CLIENT]
          example: "ROLE_CLIENT"

    SignInRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Username for authentication
          example: "john_doe"
        password:
          type: string
          description: Password for authentication
          example: "SecurePass123!"

    AuthenticatedUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: User ID
        username:
          type: string
          description: Username
        email:
          type: string
          description: User email
        token:
          type: string
          description: JWT token for authentication

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          description: New username
        email:
          type: string
          format: email
          description: New email
        password:
          type: string
          description: New password
        role:
          type: string
          enum: [ROLE_MANAGER, ROLE_CLIENT]
          description: New role

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPasswordRequest:
      type: object
      required: [token, newPassword, confirmPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
        confirmPassword:
          type: string

    AuthToken:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer

    UserActivationRequest:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: User ID
        username:
          type: string
          description: Username
        email:
          type: string
          description: User email
        role:
          type: string
          description: User role (ROLE_MANAGER or ROLE_CLIENT)
          example: "ROLE_CLIENT"

    Address:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        street:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateAddressRequest:
      type: object
      required: [street, city, country, postalCode]
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string
        isDefault:
          type: boolean

    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Category ID
        name:
          type: string
          description: Category name
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the category was created

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Category name
          example: "Electronics"

    UpdateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: New category name
          example: "Electronics & Gadgets"

    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Product ID
        name:
          type: string
          description: Product name
        description:
          type: string
          description: Product description
        price:
          type: number
          format: decimal
          description: Product price
        stock:
          type: integer
