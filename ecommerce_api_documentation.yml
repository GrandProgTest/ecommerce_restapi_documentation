openapi: 3.0.3

info:
  title: E-Commerce Nerdery REST API
  version: 1.0.0
  description: |
    REST API for an e-commerce platform following DDD and best practices.

servers:
  - url: https://api.example.com/api/v1
    description: Production server

tags:
  - name: Auth
  - name: Users
  - name: Categories
  - name: Products
  - name: Cart
  - name: Orders
  - name: Payments

security:
  - bearerAuth: []

paths:
  /auth/sign-up:
    post:
      tags: [Auth]
      summary: Sign up a new user
      description: Create a new user account
      operationId: signUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequestResource"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResource"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sign-in:
    post:
      tags: [Auth]
      summary: Sign in a user
      description: Authenticate a user and get a token
      operationId: signIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequestResource"
      responses:
        "200":
          description: User authenticated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserResource"
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sign-out:
    post:
      tags: [Auth]
      summary: Sign out user session
      description: Sign out the current user
      operationId: signOut
      responses:
        "200":
          description: Successfully signed out
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password-reset-requests:
    post:
      tags: [Auth]
      summary: Request password reset
      operationId: createPasswordResetRequest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequestResource"
      responses:
        "200":
          description: Reset email sent (always returns success to prevent email enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "If the email exists, a password reset link has been sent"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password-resets:
    post:
      tags: [Auth]
      summary: Reset password
      description: Reset user password using a valid token. An email notification will be sent to the user upon successful password change.
      operationId: createPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequestResource"
      responses:
        "200":
          description: Password reset successful, confirmation email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password has been reset successfully. A confirmation email has been sent."
        "400":
          description: Invalid input or token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      operationId: getMyProfile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResource"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{userId}/activation:
    patch:
      tags: [Users]
      summary: Activate or deactivate a user (Manager)
      operationId: updateUserActivation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserActivationRequestResource"
      responses:
        "204":
          description: User activation status updated
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    parameters:
      - $ref: "#/components/parameters/userId"

  /categories:
    get:
      tags: [Categories]
      summary: Get all categories
      description: Get all categories. Public endpoint - No authentication required.
      operationId: getAllCategories
      security: []
      responses:
        "200":
          description: Categories retrieved successfully (may be empty list)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResource"

    post:
      tags: [Categories]
      summary: Create a new category
      description: Create a new category. Only ROLE_MANAGER can create categories.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequestResource"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResource"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /categories/{categoryId}:
    get:
      tags: [Categories]
      summary: Get category by id
      description: Get category by id. Public endpoint - No authentication required.
      operationId: getCategoryById
      security: []
      parameters:
        - $ref: "#/components/parameters/categoryId"
      responses:
        "200":
          description: Category found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResource"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [Categories]
      summary: Update category
      description: Update category. Only ROLE_MANAGER can update categories.
      operationId: updateCategory
      parameters:
        - $ref: "#/components/parameters/categoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequestResource"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResource"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Categories]
      summary: Delete category
      description: Delete category. Only ROLE_MANAGER can delete categories.
      operationId: deleteCategory
      parameters:
        - $ref: "#/components/parameters/categoryId"
      responses:
        "204":
          description: Category deleted successfully
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict - Category has associated products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products:
    get:
      tags: [Products]
      summary: Get all products
      description: Get all products with optional category filter and pagination support. Public endpoint - No authentication required.
      operationId: getAllProducts
      security: []
      parameters:
        - $ref: "#/components/parameters/categoryIdParam"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
      responses:
        "200":
          description: Products retrieved successfully (may be empty list)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedProductResponseResource"

    post:
      tags: [Products]
      summary: Create a new product
      description: Create a new product. Only users with ROLE_MANAGER can create products.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequestResource"
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResource"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{productId}/activation:
    patch:
      tags: [Products]
      summary: Activate or deactivate a product (Manager)
      description: Enable or disable a product visibility and availability. Only ROLE_MANAGER can perform this action.
      operationId: updateProductActivation
      parameters:
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProductRequestResource"
      responses:
        "204":
          description: Product activation status updated
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{productId}:
    get:
      tags: [Products]
      summary: Get product by id
      description: Get product details by id. Public endpoint - No authentication required.
      operationId: getProductById
      security: []
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResource"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [Products]
      summary: Update product
      description: Update product. Only ROLE_MANAGER can update products.
      operationId: updateProduct
      parameters:
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequestResource"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResource"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Products]
      summary: Delete product
      description: Delete product. Only ROLE_MANAGER can delete products.
      operationId: deleteProduct
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "204":
          description: Product deleted successfully
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{productId}/category:
    post:
      tags: [Products]
      summary: Assign category to product
      description: Assign an existing category to a product. Only ROLE_MANAGER can assign categories.
      operationId: assignCategoryToProduct
      parameters:
        - $ref: "#/components/parameters/productId"
        - name: categoryId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Category assigned to product successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResource"
        "400":
          description: Category already assigned to product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product or category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{productId}/images:
    post:
      tags: [Products]
      summary: Upload product images (Manager)
      operationId: uploadProductImages
      parameters:
        - $ref: "#/components/parameters/productId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                isPrimary:
                  type: boolean
                  description: Set the first uploaded image as primary
      responses:
        "201":
          description: Images uploaded successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductImageResource"
        "400":
          description: Invalid file format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{productId}/images/{imageId}:
    delete:
      tags: [Products]
      summary: Delete product image (Manager)
      operationId: deleteProductImage
      parameters:
        - $ref: "#/components/parameters/productId"
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Image deleted
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product or image not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{productId}/images/{imageId}/primary:
    patch:
      tags: [Products]
      summary: Set image as primary (Manager)
      operationId: setPrimaryProductImage
      parameters:
        - $ref: "#/components/parameters/productId"
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Primary image updated
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product or image not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{productId}/likes:
    post:
      tags: [Products]
      summary: Like a product (Client)
      operationId: likeProduct
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "201":
          description: Product liked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Product liked successfully"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Product already liked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Products]
      summary: Unlike a product (Client)
      operationId: unlikeProduct
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "204":
          description: Product unliked
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product or like not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{productId}/likes/status:
    get:
      tags: [Products]
      summary: Check if current user liked a product
      operationId: getProductLikeStatus
      parameters:
        - $ref: "#/components/parameters/productId"
      responses:
        "200":
          description: Like status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isLiked:
                    type: boolean
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cart:
    get:
      tags: [Cart]
      summary: Get current user's cart
      operationId: getMyCart
      responses:
        "200":
          description: Cart details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResource"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequestResource"
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItemResource"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cart/items/{cartItemId}:
    put:
      tags: [Cart]
      summary: Update cart item quantity
      operationId: updateCartItem
      parameters:
        - $ref: "#/components/parameters/cartItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Cart item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItemResource"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cart item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Cart]
      summary: Remove item from cart
      operationId: removeCartItem
      parameters:
        - $ref: "#/components/parameters/cartItemId"
      responses:
        "204":
          description: Item removed
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cart item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    post:
      tags: [Orders]
      summary: Create order (checkout)
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequestResource"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponseResource"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Insufficient stock or invalid cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags: [Orders]
      summary: List all orders (Manager)
      operationId: listOrders
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderGetManagerResource"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{userId}/orders:
    get:
      tags: [Orders]
      summary: Get orders by user ID (Manager)
      description: Retrieve all orders for a specific user. Only ROLE_MANAGER can access orders for other users.
      operationId: getOrdersByUserId
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: User orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderResource"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/me:
    get:
      tags: [Orders]
      summary: Get current user's orders
      operationId: getMyOrders
      responses:
        "200":
          description: User orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderResource"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{orderId}/cancellation:
    post:
      tags: [Orders]
      summary: Create order cancellation
      description: Cancel a pending order. Clients can cancel their own orders, managers can cancel any order.
      operationId: createOrderCancellation
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResource"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Cannot cancel orders for other users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict - Order cannot be cancelled (already paid or cancelled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /addresses:
    get:
      tags: [Users]
      summary: Get current user's addresses
      operationId: getMyAddresses
      responses:
        "200":
          description: User addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddressResource"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Users]
      summary: Create a new address
      operationId: createAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddressRequestResource"
      responses:
        "201":
          description: Address created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressResource"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /addresses/{addressId}:
    delete:
      tags: [Users]
      summary: Delete an address
      operationId: deleteAddress
      parameters:
        - $ref: "#/components/parameters/addressId"
      responses:
        "204":
          description: Address deleted
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Cannot delete addresses of other users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payment-intents/{orderId}:
    post:
      tags: [Payments]
      summary: Create Stripe payment intent for an order
      operationId: createPaymentIntentForOrder
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentResponseResource"
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order already paid or invalid state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhooks/stripe:
    post:
      tags: [Payments]
      summary: Stripe webhook endpoint
      operationId: handleStripeWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
        "400":
          description: Invalid webhook signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/low-stock:
    post:
      tags: [Products]
      summary: Trigger low stock notifications
      description: Internal endpoint to send email notifications to users who liked a product when stock reaches 3 or below. This is typically triggered by background jobs monitoring stock levels.
      operationId: sendLowStockNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LowStockNotificationRequestResource"
      responses:
        "200":
          description: Notifications sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  notificationsSent:
                    type: integer
                    description: Number of notifications sent
                  productId:
                    type: integer
                    format: int64
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - Requires ROLE_MANAGER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    productId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    categoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    userId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    page:
      name: page
      in: query
      schema:
        type: integer
        default: 0

    size:
      name: size
      in: query
      schema:
        type: integer
        default: 10

    cartItemId:
      name: cartItemId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    addressId:
      name: addressId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    categoryIdParam:
      name: categoryId
      in: query
      required: false
      schema:
        type: integer
        format: int64
      description: Optional category ID to filter products by category

  schemas:
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Time when the error occurred
        status:
          type: integer
          description: HTTP status code
        error:
          type: string
          description: Error type
        message:
          type: string
          description: Error message
        path:
          type: string
          description: Request path

    SignUpRequestResource:
      type: object
      required: [username, email, password, role]
      properties:
        username:
          type: string
          description: Username for the new user
          example: "john_doe"
        email:
          type: string
          format: email
          description: Email address for the new user
          example: "john@example.com"
        password:
          type: string
          description: Password for the new user
          example: "SecurePass123!"
        role:
          type: string
          description: Role name (ROLE_MANAGER or ROLE_CLIENT)
          enum: [ROLE_MANAGER, ROLE_CLIENT]
          example: "ROLE_CLIENT"

    SignInRequestResource:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Username for authentication
          example: "john_doe"
        password:
          type: string
          description: Password for authentication
          example: "SecurePass123!"

    AuthenticatedUserResource:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: User ID
        username:
          type: string
          description: Username
        email:
          type: string
          description: User email
        token:
          type: string
          description: JWT token for authentication

    ForgotPasswordRequestResource:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Email address for password reset

    ResetPasswordRequestResource:
      type: object
      required: [token, newPassword, confirmPassword]
      properties:
        token:
          type: string
          description: Password reset token received via email
        newPassword:
          type: string
          description: New password to set
        confirmPassword:
          type: string
          description: Confirmation of the new password (must match newPassword)

    UserActivationRequestResource:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean
          description: Whether the user should be active (true) or deactivated (false)

    UserProfileResource:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: User ID
        username:
          type: string
          description: Username
        email:
          type: string
          description: User email
        role:
          type: string
          description: User role (ROLE_MANAGER or ROLE_CLIENT)
          example: "ROLE_CLIENT"

    AddressResource:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Address ID
        userId:
          type: integer
          format: int64
          description: ID of the user who owns this address
        street:
          type: string
          description: Street address
        city:
          type: string
        state:
          type: string
        country:
          type: string
          description: Country name
        postalCode:
          type: string
          description: Postal or ZIP code
        isDefault:
          type: boolean
          description: Whether this is the user's default address
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the address was created

    CreateAddressRequestResource:
      type: object
      required: [street, city, country, postalCode]
      properties:
        street:
          type: string
          description: Street address
        city:
          type: string
          description: City name
        state:
          type: string
          description: State or province (optional)
          nullable: true
        country:
          type: string
          description: Country name
        postalCode:
          type: string
          description: Postal or ZIP code
        isDefault:
          type: boolean
          description: Whether this should be the user's default address
          default: false

    CategoryResource:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Category ID
        name:
          type: string
          description: Category name
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the category was created

    CreateCategoryRequestResource:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Category name
          example: "Electronics"

    UpdateCategoryRequestResource:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: New category name
          example: "Electronics & Gadgets"

    ProductResource:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Product ID
        name:
          type: string
          description: Product name
        description:
          type: string
          description: Product description
        price:
          type: number
          format: decimal
          description: Product price
        stock:
          type: integer
          description: Available stock quantity
          minimum: 0
        isActive:
          type: boolean
          description: Whether the product is active
        categoryIds:
          type: array
          items:
            type: integer
            format: int64
          description: List of category IDs assigned to the product
        createdByUserId:
          type: integer
          format: int64
          description: ID of the user who created the product

    ProductImageResource:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Image ID
        productId:
          type: integer
          format: int64
          description: ID of the product this image belongs to
        imageUrl:
          type: string
          description: URL of the uploaded image
        isPrimary:
          type: boolean
          description: Whether this is the primary image for the product
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the image was uploaded

    CreateProductRequestResource:
      type: object
      required: [name, description, price, stock, categoryIds]
      properties:
        name:
          type: string
          description: Product name
          example: "Wireless Mouse"
        description:
          type: string
          description: Product description
          example: "Ergonomic wireless mouse with USB receiver"
        price:
          type: number
          format: decimal
          description: Product price
          example: 29.99
        stock:
          type: integer
          description: Available stock quantity
          minimum: 0
          example: 50
        categoryIds:
          type: array
          items:
            type: integer
            format: int64
          description: List of category IDs to assign to the product
          minItems: 1

    UpdateProductRequestResource:
      type: object
      properties:
        name:
          type: string
          description: Product name
          example: "Wireless Mouse"
        description:
          type: string
          description: Product description
          example: "Ergonomic wireless mouse with USB receiver"
        price:
          type: number
          format: decimal
          description: Product price
          example: 29.99
        stock:
          type: integer
          description: Available stock quantity
          minimum: 0
          example: 50

    PatchProductRequestResource:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean
          description: Whether the product should be active (true) or deactivated (false)

    PagedProductResponseResource:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProductResource"
          description: List of products in the current page
        totalElements:
          type: integer
          description: Total number of products across all pages
        totalPages:
          type: integer
          description: Total number of pages available

    CartResource:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Cart ID
        userId:
          type: integer
          format: int64
          description: ID of the user who owns the cart
        status:
          type: string
          enum: [ACTIVE, CHECKED_OUT, ABANDONED]
          description: Current status of the cart
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItemResource"
          description: List of items in the cart
        totalAmount:
          type: number
          description: Total amount for all items in the cart
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the cart was created
        checkedOutAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the cart was checked out (null if not checked out)

    CartItemResource:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Cart item ID
        cartId:
          type: integer
          format: int64
          description: ID of the cart this item belongs to
        productId:
          type: integer
          format: int64
          description: ID of the product
        productName:
          type: string
          description: Name of the product
        quantity:
          type: integer
          minimum: 1
          description: Quantity of the product in the cart
        unitPrice:
          type: number
          description: Price per unit at the time of adding to cart
        subtotal:
          type: number
          description: Total price for this item (unitPrice * quantity)
    AddCartItemRequestResource:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
          description: ID of the product to add to cart
        quantity:
          type: integer
          minimum: 1
          description: Quantity of the product to add

    CreateOrderRequestResource:
      type: object
      required: [addressId]
      properties:
        addressId:
          type: integer
          format: int64
          description: ID of the delivery address
        discountCode:
          type: string
          nullable: true
          description: Optional discount code to apply to the order

    CreateOrderResponseResource:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
          description: ID of the created order

    OrderGetManagerResource:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Order ID
        status:
          type: string
          enum: [PENDING, PAID, CANCELLED]
          description: Current status of the order
        totalAmount:
          type: number
          description: Total amount before discounts
        discountAmount:
          type: number
          description: Amount discounted from the total
        finalAmount:
          type: number
          description: Final amount after applying discounts
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the order was created
        cartId:
          type: integer
          format: int64
          description: ID of the cart used for this order
        userId:
          type: integer
          format: int64
          description: ID of the user who placed the order
        addressId:
          type: integer
          format: int64
          description: ID of the delivery address
        discountId:
          type: integer
          format: int64
          nullable: true
          description: ID of the applied discount (null if no discount applied)

    OrderResource:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Order ID
        status:
          type: string
          enum: [PENDING, PAID, CANCELLED]
          description: Current status of the order
        totalAmount:
          type: number
          description: Total amount before discounts
        discountAmount:
          type: number
          description: Amount discounted from the total
        finalAmount:
          type: number
          description: Final amount after applying discounts
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the order was created
        cartId:
          type: integer
          format: int64
          description: ID of the cart used for this order
        addressId:
          type: integer
          format: int64
          description: ID of the delivery address
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemResource"
          description: List of items in the order
    OrderItemResource:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Order item ID
        orderId:
          type: integer
          format: int64
          description: ID of the order this item belongs to
        productId:
          type: integer
          format: int64
          description: ID of the product
        productName:
          type: string
          description: Name of the product at the time of purchase
        priceAtPurchase:
          type: number
          description: Price per unit at the time of purchase
        quantity:
          type: integer
          description: Quantity of the product ordered
        subtotal:
          type: number
          description: Total price for this item (priceAtPurchase * quantity)

    PaymentIntentResponseResource:
      type: object
      properties:
        paymentIntentId:
          type: string
          description: Stripe payment intent ID
        clientSecret:
          type: string
          description: Client secret for completing the payment on the client side

    PaymentResource:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Payment ID
        orderId:
          type: integer
          format: int64
          description: ID of the order associated with this payment
        stripePaymentIntentId:
          type: string
          description: Stripe payment intent ID
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED]
          description: Current status of the payment
        amount:
          type: number
          description: Payment amount
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the payment was created

    LowStockNotificationRequestResource:
      type: object
      required: [productId]
      properties:
        productId:
          type: integer
          format: int64
          description: ID of the product with low stock
      description: Request to send low stock notifications to users who liked the product but haven't purchased it yet
